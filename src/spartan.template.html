<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spartan Template</title>
    <style>
        body { font-family: Courier, monospace; background: #fff; color: #000; line-height: 1.3; margin: 20px auto; max-width: 850px; padding: 0 10px; font-size: 0.9rem; }
        header { margin-bottom: 20px; border-bottom: 1px double #000; padding-bottom: 5px; }
        h1 { font-size: 1.8rem; margin: 0; text-transform: uppercase; font-weight: bold; }
        h2 { font-size: 1rem; text-transform: uppercase; margin-top: 20px; margin-bottom: 5px; font-weight: bold; border-bottom: 1px solid #000; }
        .contact-info { margin-top: 2px; }
        .job, .edu { margin-bottom: 12px; }
        .job-header, .edu-header { display: flex; justify-content: space-between; font-weight: bold; }
        .position, .study { font-style: italic; }
        ul { padding-left: 15px; margin-top: 2px; }
        li { margin-bottom: 2px; }
        .skills-list { padding: 0; list-style: none; }
        .skills-list li { display: inline; }
        .skills-list li:not(:last-child)::after { content: ", "; }
		        
        /* Combined-employer grouped view: one employer block containing
           multiple sub-positions, used when the "Grouping: Combined" toggle
           is active on the control panel. */
        .employer-group .sub-position { margin-top: 14px; padding-left: 14px; border-left: 2px solid #f0f0f0; }
        .employer-group .sub-position:first-of-type { margin-top: 10px; }
        .sub-position-header { display: flex; justify-content: space-between; font-weight: 500; color: #333; font-size: 0.95rem; }
        .sub-position-dates { color: #888; font-size: 0.85rem; white-space: nowrap; }

        @media print {
            /* Keep an employer's combined block (all its sub-positions) from
               splitting awkwardly across a page break. */
            .job, .employer-group { page-break-inside: avoid; }
        }
    </style>
</head>
<body>
    <header>
        <h1 id="res-name"></h1>
        <div id="res-label" style="font-weight: bold;"></div>
        <div class="contact-info" id="res-contact"></div>
    </header>
    <section><h2>[WORK EXPERIENCE]</h2><div id="work-section"></div></section>
    <section><h2>[EDUCATION]</h2><div id="edu-section"></div></section>
    <section><h2>[SKILLS & PROFICIENCIES]</h2><ul class="skills-list" id="skills-section"></ul></section>
    <section><h2>[CURRENT CERTIFICATIONS]</h2><div class="cert-list" id="cert-section"></div></section>
</body>
</html>
