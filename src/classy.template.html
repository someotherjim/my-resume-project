<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classy Template</title>
    <style>
        body { font-family: Georgia, serif; background: #fff; color: #222; line-height: 1.6; margin: 40px auto; max-width: 800px; padding: 0 20px; }
        header { text-align: left; margin-bottom: 35px; border-bottom: 1px solid #1a252f; padding-bottom: 10px; }
        h1 { font-size: 2.6rem; font-weight: normal; margin: 0; color: #1a252f; }
        h2 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px; color: #1a252f; margin-top: 35px; margin-bottom: 15px; font-family: Arial, sans-serif; font-weight: bold; }
        .contact-info { color: #555; font-size: 0.9rem; font-style: italic; font-family: Arial, sans-serif; margin-top: 5px; }
        .job, .edu { margin-bottom: 22px; }
        .job-header, .edu-header { display: flex; justify-content: space-between; font-family: Arial, sans-serif; font-weight: bold; font-size: 0.95rem; }
        .position, .study { font-style: italic; color: #444; margin-bottom: 4px; }
        ul { padding-left: 20px; margin-top: 5px; }
        li { margin-bottom: 5px; }
        .skills-list { display: flex; flex-wrap: wrap; gap: 10px; list-style: none; padding: 0; font-family: Arial, sans-serif; }
        .skills-list li { border: 1px solid #1a252f; padding: 3px 8px; font-size: 0.85rem; color: #1a252f; }
    </style>
</head>
<body>
    <header>
        <h1 id="res-name"></h1>
        <div id="res-label" style="font-size:1.1rem; font-style: italic; font-family: Arial, sans-serif;"></div>
        <div class="contact-info" id="res-contact"></div>
    </header>
    <section><h2>Employment History</h2><div id="work-section"></div></section>
    <section><h2>Education</h2><div id="edu-section"></div></section>
    <section><h2>Professional Core Skills</h2><ul class="skills-list" id="skills-section"></ul></section>
</body>
</html>
